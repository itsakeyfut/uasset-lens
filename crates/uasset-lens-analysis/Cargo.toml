[package]
name                 = "uasset-lens-analysis"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
description          = "Static-analysis checks for Unreal Engine 5 assets — lint rules, size budgets, Blueprint and material metrics"
repository.workspace = true
homepage.workspace   = true
keywords.workspace   = true
categories.workspace = true
authors.workspace    = true

[dependencies]
uasset-lens-asset-db         = { workspace = true }
