# .uasset-lens.toml — generated by `uasset-lens init --preset aaa`
# Large studio (> 10,000 assets). Strict rules + baseline regression gating.

# Top-level health checks. Severity: "error" fails CI, "warn" reports only, "off" disables.
[rules]
dead-assets      = "error"
circular-deps    = "error"
duplicate-assets = "error"
redirectors      = "error"

# Naming conventions + Blueprint complexity (both enforced).
[lint]
naming.enabled    = true
blueprint.enabled = true

# Per-asset-type size budgets, in bytes. Budget violations are reported as errors.
[budget]
Texture2D.max_size = 4194304  # 4 MB
Blueprint.max_size = 524288   # 512 KB

# Regression gating: `check` auto-diffs against this committed baseline and fails on new
# error violations. Create it once with `check --save-baseline` and commit it to git.
[check]
baseline_path = ".uasset-lens/baseline.json"
