# .uasset-lens.toml — generated by `uasset-lens init --preset indie`
# Indie / solo project (< 1,000 assets). Relaxed rules so work-in-progress assets
# do not block CI. Tighten these as the project grows (`--preset mid` / `aaa`).

# Top-level health checks. Severity: "error" fails CI, "warn" reports only, "off" disables.
[rules]
dead-assets      = "off"     # unreferenced assets are common while prototyping
circular-deps    = "warn"
duplicate-assets = "off"
redirectors      = "warn"

# Naming conventions + Blueprint complexity.
[lint]
naming.enabled    = true      # enforce asset naming prefixes (T_, M_, BP_, ...)
blueprint.enabled = false     # no Blueprint complexity enforcement yet

# Per-asset-type size budgets, in bytes. Budget violations are reported as errors.
[budget]
Texture2D.max_size = 8388608  # 8 MB
Blueprint.max_size = 2097152  # 2 MB
