# .uasset-lens.toml — generated by `uasset-lens init --preset mid`
# Mid-size studio (1,000–10,000 assets). Balanced rules: cycles and budgets block CI,
# dead assets and duplicates are reported as warnings.

# Top-level health checks. Severity: "error" fails CI, "warn" reports only, "off" disables.
[rules]
dead-assets      = "warn"
circular-deps    = "error"
duplicate-assets = "warn"
redirectors      = "warn"

# Naming conventions + Blueprint complexity (both enforced).
[lint]
naming.enabled    = true
blueprint.enabled = true

# Per-asset-type size budgets, in bytes. Budget violations are reported as errors.
[budget]
Texture2D.max_size = 6291456  # 6 MB
Blueprint.max_size = 1048576  # 1 MB
