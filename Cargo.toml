[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/scanner",
    "crates/asset-db",
    "crates/dependency-graph",
    "crates/dead-asset-detector",
    "crates/impact-analyzer",
    "crates/redirector-analyzer",
    "crates/bp-analyzer",
    "crates/duplicate-detector",
    "crates/lint-engine",
    "crates/material-analyzer",
    "crates/budget-tracker",
    "crates/watcher",
    "crates/git-diff",
    "crates/cli",
    "apps/uasset-lens-cli",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96.0"
authors      = ["itsakeyfut"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/itsakeyfut/uasset-lens"
homepage     = "https://github.com/itsakeyfut/uasset-lens"
description  = "Fast, CLI-first static analyzer for Unreal Engine 5 .uasset / .umap files"
keywords     = ["unreal-engine", "uasset", "static-analysis", "game-development"]
categories   = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
thiserror  = "2.0.18"
serde      = { version = "1.0.228", features = ["derive"] }
byteorder  = "1.5.0"
rayon      = "1.12.0"
walkdir    = "2.5.0"
rusqlite   = { version = "0.39.0", features = ["bundled"] }
clap       = { version = "4.6.1", features = ["derive"] }
anyhow     = "1.0.102"
tracing    = "0.1.44"
petgraph   = "0.8.3"
serde_json = "1.0.149"
toml       = "1"
globset    = "0.4"
notify     = "6"
tempfile   = "3.27.0"
ctrlc      = "3.5.2"

[profile.dev]
opt-level    = 0
debug        = true
incremental  = true

# Optimize dependencies (rusqlite, rayon, byteorder, etc.) even in dev builds so
# binary parsing and SQLite operations don't become the bottleneck during iteration.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all                              = { level = "warn", priority = -1 }
pedantic                         = { level = "warn", priority = -1 }
unwrap_used                      = "warn"
expect_used                      = "warn"
panic                            = "warn"
module_name_repetitions          = "allow"
too_many_lines                   = "allow"
must_use_candidate               = "allow"
missing_errors_doc               = "allow"
missing_panics_doc               = "allow"
similar_names                    = "allow"
if_not_else                      = "allow"
match_same_arms                  = "allow"
uninlined_format_args            = "allow"
redundant_closure_for_method_calls = "allow"
