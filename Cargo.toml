[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/scanner",
    "crates/asset-db",
    "crates/dependency-graph",
    "crates/dead-asset-detector",
    "crates/cli",
    "apps/uasset-lens-cli",
]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
authors    = ["itsakeyfut"]
license    = "MIT"
repository = "https://github.com/itsakeyfut/uasset-lens"

[workspace.dependencies]
thiserror  = "2.0.18"
serde      = { version = "1.0.228", features = ["derive"] }
nom        = "8.0.0"
byteorder  = "1.5.0"
rayon      = "1.12.0"
walkdir    = "2.5.0"
rusqlite   = { version = "0.39.0", features = ["bundled"] }
clap       = { version = "4.6.1", features = ["derive"] }
anyhow     = "1.0.102"
tracing    = "0.1.44"
petgraph   = "0.8.3"
serde_json = "1.0.149"
toml       = "1"
globset    = "0.4"

[profile.dev]
opt-level    = 0
debug        = true
incremental  = true

# Optimize dependencies (rusqlite, rayon, nom, etc.) even in dev builds so
# binary parsing and SQLite operations don't become the bottleneck during iteration.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
