version: 2
updates:
  # Rust workspace dependencies
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - T-Maintenance
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used across .github/workflows/
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels:
      - T-Maintenance
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
