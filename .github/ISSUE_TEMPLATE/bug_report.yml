name: Bug Report
description: Report a bug or unexpected behavior in uasset-lens
title: "[Bug]: "
labels: ["T-Fix"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide enough detail to reproduce the problem.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        Describe the bug. Include the exact command you ran, the assets involved,
        and what went wrong (wrong output, panic, incorrect exit code, etc.).
      placeholder: |
        Running `uasset-lens lint /Content` on a project with ~800 assets produces a
        false positive on every Blueprint asset:

        ```
        $ uasset-lens lint /Game/UI
        WARN  BP_HUDWidget [naming/blueprint-prefix]: name does not start with "BP_"
        ```

        The asset name IS `BP_HUDWidget`, so the prefix check is incorrectly rejecting it.
        The rule fires on the class name instead of the asset file name.
    validations:
      required: true

  - type: textarea
    id: desired_behaviour
    attributes:
      label: Desired Behaviour
      description: What should uasset-lens do instead?
      placeholder: |
        The `naming/blueprint-prefix` rule should check the asset file name
        (e.g. `BP_HUDWidget.uasset`), not the internal class name stored in the export table.
        Assets whose file name already starts with `BP_` should pass the rule.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Fix
      description: |
        Proposed implementation — file paths, code changes, and steps.
        Leave blank if you are unsure how to fix it.
      placeholder: |
        ### Step 1 — Read asset name from AssetPath, not export class name

        ```rust
        // crates/lint-engine/src/rules/naming.rs
        fn check(&self, asset: &AssetRecord) -> Vec<LintViolation> {
            let file_stem = asset.path.asset_name(); // was: asset.class_name
            if !file_stem.starts_with("BP_") { … }
        }
        ```

        ### Step 2 — Add regression test

        ```rust
        // crates/lint-engine/src/rules/naming.rs — mod tests
        #[test]
        fn blueprint_prefix_should_pass_when_filename_starts_with_bp() { … }
        ```

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Conditions that must hold for this bug to be considered fixed.
      placeholder: |
        - [ ] `uasset-lens lint` does not report `naming/blueprint-prefix` for assets whose
              file name starts with `BP_`
        - [ ] Unit test `blueprint_prefix_should_pass_when_filename_starts_with_bp` passes
        - [ ] `cargo test --workspace` passes
        - [ ] Exit code is `0` when no real violations are found
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: uasset-lens version, OS, Rust toolchain, and UE5 project details if relevant.
      placeholder: |
        - uasset-lens: 0.1.0 (`uasset-lens --version`)
        - OS: Windows 11 / macOS 15 / Ubuntu 24.04
        - Rust: rustc 1.96.0 (`rustc --version`)
        - UE version: 5.4.4
        - Asset count: ~800
      render: markdown

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Error output, backtraces (`RUST_BACKTRACE=1`), related issues, or workarounds.
      placeholder: |
        - `RUST_LOG=lint_engine=debug uasset-lens lint /Game/UI` shows the class name
          lookup path is triggered instead of the file stem path
        - Only occurs on Blueprint assets; StaticMesh and Texture2D are not affected
        - Related: #42 (naming rule refactor)
        - Workaround: disable `naming/blueprint-prefix` in `.uasset-lens.toml`

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided enough detail to reproduce or understand the problem
          required: true
        - label: I have tested on the latest release
          required: false
