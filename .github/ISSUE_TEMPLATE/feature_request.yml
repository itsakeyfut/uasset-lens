name: Feature Request
description: Suggest a new feature or improvement for uasset-lens
title: "[Feature]: "
labels: ["T-Feat"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe the UE5 workflow problem
        you are solving and how you envision the solution fitting into uasset-lens.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the feature in 1-2 sentences.
      placeholder: |
        Add a `uasset-lens unused-slots` command that lists Material assets containing
        texture sample slots that are connected to the default engine texture instead of
        a project texture, flagging potential "forgotten placeholder" setups.
    validations:
      required: true

  - type: textarea
    id: design_notes
    attributes:
      label: Design Notes
      description: |
        Architecture considerations, relevant crates, file paths, or implementation constraints.
        Use `> **Note**:` for anything that requires investigation before implementation.
      placeholder: |
        Affected crates: `crates/material-analyzer/`, `crates/lint-engine/src/rules/`, `crates/cli/`

        - Parse texture sample count from `material-analyzer` (already implemented via
          `MaterialStats::texture_sample_count`).
        - Add a new lint rule `material/unused-texture-slot` in `crates/lint-engine/src/rules/`.
        - Wire up the rule in `LintEngine::rules()` alongside existing material checks.
        - CLI: the rule fires through the existing `uasset-lens lint` command — no new subcommand needed.

        > **Note**: Investigate whether the `.uasset` export table for a Material stores
        > the referenced texture path or only the slot index. Check `parser/export.rs`.
    validations:
      required: false

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Implementation checklist. Each line becomes a trackable task on the issue.
      placeholder: |
        - [ ] New lint rule `material/unused-texture-slot` detects default-engine textures
              referenced by project Material assets
        - [ ] Rule is controlled by `.uasset-lens.toml` (can be disabled per-project)
        - [ ] `uasset-lens lint` JSON output includes the rule_id and the offending slot path
        - [ ] Exit code is `1` when at least one violation is found
        - [ ] Unit tests cover: no violation (all slots are project textures),
              one violation (one default engine texture), and disabled-rule case
        - [ ] `cargo test --workspace` passes
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related
      description: Dependencies, related issues, UE5 workflow context, or prior art.
      placeholder: |
        Depends on: #88 (material-analyzer texture path export parsing)
        Related: #101 (lint rule for excessive texture sample count)
        UE5 context: default engine textures (T_Default_Material_Grid, etc.) are placeholders;
        shipping with them is a common oversight in large teams

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature
          required: false
        - label: I can provide a sample `.uasset` file or test fixture
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have checked the roadmap to see if this is already planned
          required: false
        - label: This feature aligns with the project's goals (fast UE5 static analysis from the CLI)
          required: false
